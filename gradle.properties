# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.java.installations.auto-download=false

mod_version=3.12.1

# Minecraft Version Information
minecraft_base_version=26.1.2
minecraft_version=26.1.2
minecraft_range=[26.1,26.2)

# NeoForge Version Information
neoforge_version=26.1.2.109
neoforge_range=[26.1.2.78,26.2)
# Keep the JavaFML loader open, but restrict the NeoForge dependency range below.
loader_range=*
# forge_range=*

# Build Dependencies
mantle_version=1.12.0
mantle_range=[1.12.0,1.13)

# Optional compat
jei_version=29.34.0.90
jei_range=[29.34.0.90,)
#probe_version=5.1.0
#crt_version=7.1.0.307
#crt_range=[7.1.0.245,)
ie_version=9.4.0-166.40
json_things_version=0.18.2
json_things_range=[0.18.2,)
placebo_version=10.0.2
apotheosis_version=9.0.3
apotheosis_range=[9.0.2,)
jade_file_id=7886513
jade_range=[26.0.0,)

# Isolated survival-fix candidate; keep distinct from frozen Arthur .4.
# ARTIFACT_VERSION=3.12.2-arthur.5
# Parity integration (2026-09-29): contains .5 survival fixes plus the client crash
# fixes shipped as .6/.7, so the next release number is .8. Streams override with
# -PARTIFACT_VERSION=3.12.2-arthur.8-<stream> through tools/build-locked.ps1.
# ARTIFACT_VERSION=3.12.2-arthur.8-dev
# Release arthur.8 (2026-09-29): all five parity streams merged on release/arthur.8.
ARTIFACT_VERSION=3.12.2-arthur.8
