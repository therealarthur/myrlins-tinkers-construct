modLoader="javafml"
loaderVersion="${loader_range}"
issueTrackerURL="https://github.com/justduck25/Tinker-Construct-3-NeoForge/issues"
logoFile="logo.png"
license="MIT"

[[mods]]
    modId="tconstruct"
    version="${version}"
    displayName="Continuum Construct"
    authors="Slime Knights, justduck25"
    enumExtensions="META-INF/enumextensions.json"
    description='''
Community NeoForge 26.1 port of the classic modular tool, material, modifier, and smeltery experience.
    '''
    displayURL="https://github.com/justduck25/Tinker-Construct-3-NeoForge"

[[mixins]]
    config="tconstruct.mixins.json"

# Client only: book and station label fixes for stock Continuum Core 1.12.1 (folded in from the private Core fork).
[[mixins]]
    config="tconstruct.client.mixins.json"

[[dependencies.tconstruct]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="mantle"
    type="required"
    versionRange="${mantle_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="jei"
    type="optional"
    versionRange="${jei_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="jsonthings"
    type="optional"
    versionRange="${json_things_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="apotheosis"
    type="optional"
    versionRange="${apotheosis_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="enderio"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="athena"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="jade"
    type="optional"
    versionRange="${jade_range}"
    ordering="NONE"
    side="BOTH"
